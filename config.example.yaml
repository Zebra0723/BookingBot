# courtbot — copy to config.yaml and edit.
#
# Credentials are NOT stored here. Export them instead:
#   export DL_USERNAME='you@example.com'
#   export DL_PASSWORD='...'
# or, if the app signs in with a refresh token:
#   source captured/secrets.env
# The loader refuses to start if it finds a secret in this file.

club:
  name: "Harbour Club Chelsea"
  activity: tennis             # tennis | padel | badminton | pickleball
  duration_minutes: 60         # 30 | 60 | 90 | 120

  # Filled in from discovery if the API needs them. Leave blank until then —
  # `courtbot discover` prints the values it saw.
  club_id: ""
  activity_id: ""

  # Optional tie-break when several courts are free at the same time.
  # Only breaks ties; it never overrides your time preference below.
  court_preference: []
  # court_preference: ["Court 1", "Court 2"]

window:
  # Harbour Club Chelsea publishes 9 days in advance online (8 via reception).
  # Booking on a Monday reaches the following Wednesday.
  advance_days: 9

  # IMPORTANT: verify this before relying on it. David Lloyd documents 7:30am
  # for some clubs and 8am for others, and Chelsea is not in the published
  # 7:30am list. Run `courtbot calibrate` once — it watches the boundary and
  # tells you the real time to the second. Seconds are allowed: "07:30:15".
  #
  # This is LOCAL London time. Which of BST/GMT applies is decided by the day
  # the release happens, not the day being booked — they differ four times a
  # year, and the bot handles that.
  release_time: "08:00"
  timezone: Europe/London

# Which weekday you want, and the start times to try, BEST FIRST.
# Exactly one new date opens at each release, so a weekday listed here is
# attempted only on the morning it opens.
targets:
  - weekday: saturday
    times: ["10:00", "11:00", "09:00"]
  - weekday: sunday
    times: ["10:00", "09:00"]

attempts:
  # Send the first request slightly early so it arrives as the window opens.
  # Raise if your connection is slow; too high and the server rejects it.
  prefire_ms: 250
  retry_for_seconds: 45
  retry_interval_ms: 400
  request_timeout: 10

base_url: ""                   # inferred from discovery if left blank
recipe_path: "captured/recipe.json"

# Where the secrets live. You only need whichever the captured sign-in
# actually uses: a password exchange, or a refresh-token renewal. `discover`
# writes a captured refresh token to captured/secrets.env for you.
username_env: DL_USERNAME
password_env: DL_PASSWORD
refresh_token_env: DL_REFRESH_TOKEN

notify: true
dry_run: false

# Free-form, passed through to the recipe's value bag. Rarely needed.
extras: {}
